<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Explore selected 2021 Census characteristics across Vancouver dissemination areas.">
    <title>Vancouver Census Map</title>
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="map-page">
      <header class="map-header">
        <div class="map-heading">
          <p class="map-eyebrow">2021 Census of Population</p>
          <h1>Vancouver Census Map</h1>
          <div class="mode-control" role="group" aria-label="Map display mode">
            <button id="single-mode" type="button" aria-pressed="true">Single map</button>
            <button id="compare-mode" type="button" aria-pressed="false">Compare</button>
          </div>
        </div>
        <div class="map-variable-controls">
          <div class="map-picker">
            <label for="variable-select">Map variable</label>
            <select id="variable-select">
              <option value="C6">Population density</option>
              <option value="C40">Median age</option>
              <option value="C42">Single-detached houses</option>
              <option value="C47">Apartments in buildings with five or more storeys</option>
              <option value="C113">Median income (individuals)</option>
              <option value="C1474">Median dwelling value</option>
            </select>
          </div>
          <div id="compare-picker" class="map-picker" hidden>
            <label for="compare-variable-select">Comparison variable</label>
            <select id="compare-variable-select">
              <option value="C6">Population density</option>
              <option value="C40">Median age</option>
              <option value="C42">Single-detached houses</option>
              <option value="C47">Apartments in buildings with five or more storeys</option>
              <option value="C113">Median income (individuals)</option>
              <option value="C1474">Median dwelling value</option>
            </select>
          </div>
        </div>
      </header>

      <div id="map-grid" class="map-grid">
        <aside id="selection-overlap" class="selection-overlap" aria-live="polite" hidden></aside>

        <section class="map-stage" aria-label="Interactive choropleth map of Vancouver dissemination areas">
          <div id="map" class="map-canvas"></div>

          <aside id="info-panel" class="info-panel" aria-live="polite" hidden></aside>

          <aside class="legend" aria-label="Map legend">
            <div class="legend-header">
              <h2 id="legend-title">Population density</h2>
              <button id="legend-toggle" class="legend-toggle" type="button" aria-expanded="true" aria-controls="legend-content" aria-label="Collapse legend">−</button>
            </div>
            <div id="legend-content" class="legend-content">
              <div id="legend-classes" class="legend-classes"></div>
              <button id="clear-selection" class="legend-clear" type="button" hidden>Clear selection</button>
            </div>
          </aside>

          <p class="map-source">Sources: Statistics Canada, 2021 Census; City of Vancouver roads; TransLink GTFS transit data.</p>
        </section>

        <section id="compare-panel" class="map-stage" aria-label="Comparison choropleth map of Vancouver dissemination areas" hidden>
          <div id="compare-map" class="map-canvas"></div>

          <aside id="compare-info-panel" class="info-panel" aria-live="polite" hidden></aside>

          <aside class="legend" aria-label="Comparison map legend">
            <div class="legend-header">
              <h2 id="compare-legend-title">Population density</h2>
              <button id="compare-legend-toggle" class="legend-toggle" type="button" aria-expanded="true" aria-controls="compare-legend-content" aria-label="Collapse legend">−</button>
            </div>
            <div id="compare-legend-content" class="legend-content">
              <div id="compare-legend-classes" class="legend-classes"></div>
              <button id="compare-clear-selection" class="legend-clear" type="button" hidden>Clear selection</button>
            </div>
          </aside>

          <p class="map-source">Sources: Statistics Canada, 2021 Census; City of Vancouver roads; TransLink GTFS transit data.</p>
        </section>
      </div>
    </main>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="vendor/jenks.js"></script>
    <script src="map.js"></script>
  </body>
</html>
