<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive map of the 2026 Quebec provincial election results."
    />
    <title>Quebec 2026 Election Results</title>
    <link rel="stylesheet" crossorigin href="./assets/index-D9bO2Rkh.css">
    <script type="module" crossorigin src="./assets/index-CPToxS7P.js"></script>
  </head>
  <body>
    <main class="map-shell">
      <div id="map" aria-label="Interactive map of Quebec election results"></div>

      <section class="layer-switcher" aria-label="Results geography">
        <span class="control-label">Results by</span>
        <div class="segmented-control">
          <button type="button" data-layer="polling" class="is-active" aria-pressed="true">
            Polling area
          </button>
          <button type="button" data-layer="district" aria-pressed="false">
            Electoral district
          </button>
        </div>
        <p id="load-status" class="load-status" role="status">Loading polling areas…</p>
      </section>

      <aside id="results-panel" class="results-panel" aria-live="polite">
        <p class="eyebrow">Quebec election 2026</p>
        <h1>Explore the results</h1>
        <p class="panel-instruction">Hover over a polling area to see its vote distribution.</p>
      </aside>

      <aside id="legend" class="legend" aria-label="Political party colour legend"></aside>
    </main>
  </body>
</html>
