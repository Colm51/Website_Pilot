<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ontario municipalities and Census Divisions map</title>
    <link rel="stylesheet" href="../../vendor/leaflet/leaflet.css">
    <style>
      html,
      body,
      #ontario-cd-map {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ebe3d7;
        color: #231f1a;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #ontario-cd-map {
        position: relative;
      }

      .map-status {
        position: absolute;
        z-index: 1000;
        top: 0.75rem;
        left: 50%;
        max-width: calc(100% - 8rem);
        padding: 0.5rem 0.75rem;
        transform: translateX(-50%);
        border: 1px solid #d7ccbe;
        border-radius: 0.2rem;
        background: rgba(244, 239, 231, 0.96);
        box-shadow: 0 1px 5px rgba(35, 31, 26, 0.22);
        font-size: 0.82rem;
        text-align: center;
      }

      .map-status[hidden] {
        display: none;
      }

      .feature-popup {
        min-width: 13rem;
        line-height: 1.45;
      }

      .feature-popup strong {
        display: block;
        margin-bottom: 0.35rem;
        font-size: 1rem;
      }

      .feature-popup dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.2rem 0.65rem;
        margin: 0;
      }

      .feature-popup dt {
        font-weight: 700;
      }

      .feature-popup dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .feature-hover-tooltip {
        max-width: min(20rem, calc(100vw - 2rem));
        white-space: normal;
      }

      .feature-hover-tooltip .feature-popup {
        min-width: 12rem;
      }

      @media (max-width: 35rem) {
        .map-status {
          top: auto;
          right: 0.6rem;
          bottom: 0.6rem;
          left: 0.6rem;
          max-width: none;
          transform: none;
        }

        .leaflet-control-layers-expanded {
          max-width: calc(100vw - 4.5rem);
          font-size: 0.78rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="ontario-cd-map" aria-label="Interactive map of Ontario municipal boundaries, separated municipalities, and Census Divisions"></div>
    <p class="map-status" id="map-status" role="status">Loading map layers…</p>
    <script src="../../vendor/leaflet/leaflet.js"></script>
    <script src="./ontario-cd-map.js"></script>
  </body>
</html>
