<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ontario municipal and census subdivision crosswalk map</title>
    <link rel="stylesheet" href="../../vendor/leaflet/leaflet.css">
    <style>
      html,
      body,
      #municipal-map {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ebe3d7;
        color: #231f1a;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #municipal-map {
        position: relative;
      }

      .map-status {
        position: absolute;
        z-index: 1000;
        top: 0.75rem;
        left: 50%;
        max-width: calc(100% - 7rem);
        padding: 0.5rem 0.75rem;
        transform: translateX(-50%);
        border: 1px solid #d7ccbe;
        border-radius: 0.2rem;
        background: rgba(244, 239, 231, 0.96);
        box-shadow: 0 1px 5px rgba(35, 31, 26, 0.22);
        font-size: 0.82rem;
        text-align: center;
      }

      .map-status[hidden] {
        display: none;
      }

      .municipal-popup {
        min-width: 13rem;
        line-height: 1.45;
      }

      .municipal-popup strong {
        display: block;
        margin-bottom: 0.35rem;
        font-size: 1rem;
      }

      .municipal-popup dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.2rem 0.65rem;
        margin: 0;
      }

      .municipal-popup dt {
        font-weight: 700;
      }

      .municipal-popup dd {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="municipal-map" aria-label="Interactive map of Ontario municipal boundaries and matched census subdivisions"></div>
    <p class="map-status" id="map-status" role="status">Loading 414 municipal boundaries…</p>
    <script src="../../vendor/leaflet/leaflet.js"></script>
    <script src="./municipal-csd-map.js"></script>
  </body>
</html>
